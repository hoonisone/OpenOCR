[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openocr-python"
version = "0.1.5"
description = "Accurate and Efficient General OCR System"
readme = "README.md"
requires-python = ">=3.8"
license = "Apache-2.0"
authors = [
  { name = "OCR Team, FVL Lab", email = "784990967@qq.com" }
]
keywords = [
  "ocr",
  "optical character recognition",
  "text detection",
  "text recognition",
  "document parsing",
  "computer vision"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
  "imgaug",
  "lmdb",
  "numpy",
  "opencv-python",
  "pyclipper",
  "pyyaml",
  "rapidfuzz",
  "tqdm",
  "dataset",
  "evaluate",
  "levenshtein",
  "Pillow",
  "pydantic",
  "shapely",
  "huggingface-hub",
  "modelscope",
  "onnxruntime",
  "PyMuPDF"
]

[project.optional-dependencies]
onnx-gpu = ["onnxruntime-gpu"]
pytorch = ["torch", "torchvision"]
gradio = ["gradio"]
all = ["torch", "torchvision", "gradio", "onnxruntime-gpu"]

[project.urls]
Homepage = "https://github.com/Topdu/OpenOCR"
Documentation = "https://github.com/Topdu/OpenOCR/tree/main/docs"
Repository = "https://github.com/Topdu/OpenOCR"
Issues = "https://github.com/Topdu/OpenOCR/issues"

[project.scripts]
openocr = "openocr.openocr:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["openocr*"]

[tool.setuptools.package-data]
openocr = ["**/*.txt", "**/*.yaml", "**/*.yml", "**/*.ttf", "**/*.md"]
